name: Offline Accounting Invariants
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compilation
        run: python -m py_compile global_settlement_gate.py tests/test_global_settlement_gate.py tests/reality_check_harness.py
      - name: Real offline regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust format and compilation
        run: |
          cargo fmt --all -- --check
          cargo test
